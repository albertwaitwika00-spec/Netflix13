<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Kenya - Watch TV Shows Online</title>
    <script src="https://kit.fontawesome.com/bb2bd826f1.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <nav>
      <span class="logo">NETFLIX</span>
      <button class="btn-sign">Sign In</button>
    </nav>

    <div class="hero">
      <h1>Unlimited movies, TV<br>shows, and more</h1>
      <p class="p1">Starts at Ksh 200. Cancel anytime.</p>
      <p class="p2">Ready to watch? Enter your email to create or restart your membership.</p>
      
      <div class="email-box">
        <input type="email" placeholder="Email address"required>
        <button class="btn-start">Get Started <i><i class="fa-solid fa-arrow-right-long"></i></i></button>
      </div>
    </div>
  </div>
</body>
</html>
